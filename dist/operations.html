<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hamzury OS · Operating Centre</title><style>
:root{--ink:#18282b;--muted:#75827d;--paper:#f4f5ef;--line:#dce1d7;--green:#254f42;--lime:#d9eea4;--orange:#f7b768}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:8px;padding:11px 16px;background:var(--green);color:white}button:hover{filter:brightness(1.1)}button.secondary{background:#e8ede3;color:var(--ink)}aside{width:232px;position:fixed;inset:0 auto 0 0;background:#183b31;color:#e5ecdf;padding:30px 20px;display:flex;flex-direction:column}.brand{font-size:27px;letter-spacing:-1px;font-weight:750}.brand small{font-size:10px;display:block;letter-spacing:3px;font-weight:500;margin-top:5px;color:#b6c7ba}.nav{margin-top:46px;display:grid;gap:6px}.nav button{background:none;color:#bed0c3;text-align:left;padding:13px}.nav button.active{background:#355749;color:white}.nav button span{margin-right:12px}.sidefoot{margin-top:auto;font-size:11px;line-height:1.8;color:#b0c4b5}main{margin-left:232px;padding:0 42px 45px;max-width:1600px}header{height:85px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:12px}.eyebrow{font-size:10px;letter-spacing:2px;font-weight:700;text-transform:uppercase;color:var(--muted)}.pill{display:inline-block;border-radius:20px;background:#e2eadb;color:var(--green);padding:6px 10px;font-size:11px}.topright{display:flex;gap:12px;align-items:center}select,input,textarea{border:1px solid var(--line);border-radius:7px;background:white;padding:11px;width:100%;color:var(--ink)}select{width:auto}h1{font-size:38px;letter-spacing:-1.6px;font-weight:550;margin:10px 0}h2{font-size:21px;font-weight:600;letter-spacing:-.5px}h3{font-size:15px;margin:0 0 9px}p{line-height:1.65;color:#64716a} .intro{padding:30px 0 22px;display:flex;justify-content:space-between;align-items:center;gap:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.stats{grid-template-columns:repeat(4,1fr);margin:0 0 26px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:23px}.metric{font-size:32px;margin:12px 0 4px;letter-spacing:-1px}.small{font-size:12px;color:var(--muted)}.hero{background:var(--green);color:white;border:0;grid-column:span 2;min-height:220px;position:relative;overflow:hidden}.hero p{color:#c3d3c6;max-width:440px}.hero h2{font-size:29px;max-width:420px;margin-top:15px}.hero .pill{background:var(--lime)}.hero:after{content:'↗';position:absolute;right:32px;bottom:-22px;font-size:155px;color:#406a52}.light{background:var(--lime);color:#213c2c}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:28px 0 15px}.venture{display:flex;gap:15px;align-items:start}.mark{width:40px;height:40px;border-radius:9px;background:#edf0e8;display:grid;place-items:center;font-size:18px;font-weight:750}.venture p{font-size:12px;margin:4px 0 12px}.bar{height:5px;background:#e8eee1;border-radius:4px;margin-top:14px}.bar i{display:block;height:5px;border-radius:4px;background:#83a371}.row{display:flex;align-items:center;justify-content:space-between;gap:15px;border-bottom:1px solid var(--line);padding:16px 0}.row:last-child{border-bottom:0}.tag{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#758479}.two{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.step{padding:20px;border:1px solid var(--line);background:white;border-radius:10px}.step b{display:block;font-size:12px;color:#80947f;margin-bottom:14px}.step p{font-size:12px;margin-bottom:0}.notice{padding:14px 18px;background:#edf0e5;border-radius:9px;font-size:12px;line-height:1.7;margin:15px 0}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.tabs button{background:#e6eadf;color:var(--ink)}.tabs button.active{background:var(--green);color:white}label{display:block;font-size:12px;font-weight:600;margin:17px 0 7px}textarea{min-height:85px}form{max-width:700px}.check{display:flex;gap:10px;align-items:center;padding:12px 0}.check input{width:auto}.empty{padding:30px;text-align:center}.toast{position:fixed;bottom:24px;right:25px;background:#183b31;color:white;padding:16px 24px;border-radius:10px;z-index:5}.progress{display:flex;gap:4px;margin:20px 0}.progress i{height:5px;background:#dce4d4;flex:1}.progress i.on{background:#55774f}.wide{grid-column:1/-1}details{border-bottom:1px solid var(--line);padding:18px 0}summary{cursor:pointer;font-weight:600}ul{padding-left:20px;line-height:1.9;color:#64716a}footer{margin-top:35px;border-top:1px solid var(--line);padding-top:20px;font-size:10px;letter-spacing:2px;color:#81907e} .status{color:#916225;background:#faf0d7;padding:5px 8px;border-radius:5px;font-size:11px}@media(max-width:1000px){main{padding:0 22px 30px}.grid{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.flow{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){aside{position:relative;width:auto;padding:20px}.brand small,.sidefoot{display:none}.nav{display:flex;overflow:auto;margin-top:17px}.nav button{white-space:nowrap;font-size:12px;padding:10px}.nav button span{display:none}main{margin:0;padding:0 18px 30px}header{height:70px}.topright .pill{display:none}h1{font-size:29px}.intro{align-items:start}.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.hero{grid-column:auto}.flow{grid-template-columns:1fr 1fr}.card{padding:19px}.intro>button{font-size:11px}.metric{font-size:27px}}
</style><link rel="stylesheet" href="brand.css"></head><body><aside><div class="brand">hamzury<span style="color:#d9eea4">.</span><small>HOLDING OPERATING SYSTEM</small></div><nav class="nav" id="nav"></nav><div class="sidefoot">Awareness → Strategy → Structure<br>Systems → Success<br><br>ONE STANDARD. SHARED PROGRESS.</div></aside><main><header><div><span class="eyebrow">Workspace / <span id="crumb">Overview</span></span></div><div class="topright"><span class="pill">● Experience mode</span><select id="role" aria-label="Preview role"><option>Holding management</option><option>Venture CEO</option><option>Team member</option><option>Client</option></select></div></header><div id="app"></div><footer>HAMZURY HOLDING · AWARENESS → STRATEGY → STRUCTURE → SYSTEMS → SUCCESS</footer></main><script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ventures=[['bizdoc','Compliance, documents, certificates, tax & licences','B','#dcebd5'],['medialy','Branding, marketing, content & sales conversion','m','#f6dfcc'],['subt','Software, automation, websites & workflows','s','#dce3f1'],['iotics','Smart homes, IoT, robotics & hardware','i','#e9e1f0'],['hamzury hub','Digital skills, business training & talent development','h','#f4eacb'],['iwiin','Grants, partnerships & opportunity development','w','#dce9e9']];
let page='Overview', day='Monday', journey=0,selected=[],discovery=JSON.parse(localStorage.getItem('hh-discovery')||'{}');
let tasks=JSON.parse(localStorage.getItem('hh-tasks')||'null')||[{title:'Prepare daily priorities and checklist',venture:'medialy',owner:'Team member',due:'08:30',status:'In progress',standard:'Priorities linked to weekly targets; calendar blocks and blockers recorded.',evidence:''},{title:'Review discovery and prepare client roadmap',venture:'bizdoc',owner:'Operations lead',due:'12:00',status:'Ready',standard:'Separate confirmed facts from assumptions; include scope, requirements and approved pricing.',evidence:''},{title:'Test reusable software configuration',venture:'subt',owner:'Technical lead',due:'15:00',status:'Under review',standard:'Verify supported configuration, core workflow and acceptance criteria.',evidence:'Demonstration QA checklist submitted.'}];
const menus=['Overview','Workflow map','Client journey','Work & approvals','Calendar & reports','Ventures & people','Products & growth','Standards library'];
function nav(){ $('#nav').innerHTML=menus.map((x,i)=>`<button class="${page===x?'active':''}" onclick="go('${x}')"><span>${['◈','⌘','↗','▤','▦','◎','◇','☷'][i]}</span>${x}</button>`).join('');$('#crumb').textContent=page;}
function go(x){page=x;nav();render();window.scrollTo(0,0)}
function intro(k,t,p,btn=''){return `<div class="intro"><div><div class="eyebrow">${k}</div><h1>${t}</h1><p style="margin:6px 0">${p}</p></div>${btn}</div>`}function card(t,p){return `<div class="card"><h3>${t}</h3><p>${p}</p></div>`}function toast(t){let x=document.createElement('div');x.className='toast';x.textContent=t;document.body.append(x);setTimeout(()=>x.remove(),3000)}function persist(){localStorage.setItem('hh-tasks',JSON.stringify(tasks))}
function render(){let html='';if(page==='Overview'){html=intro('The holding at a glance','Everything connected.','Six ventures. One operating rhythm. A clear next action.',`<button onclick="go('Client journey')">Experience a client journey ↗</button>`)+`<div class="notice">Interactive demonstration · Sample work and figures only. Changes stay in this browser. Role previews explain responsibilities; they do not provide production access control.</div><div class="grid stats">${[['06','Independent ventures','Shared standards, specialist delivery'],[String(tasks.filter(t=>t.status!=='Approved').length).padStart(2,'0'),'Open sample tasks','Evidence required before approval'],['48h','Client update standard','Alert and escalate when overdue'],['08–17','Working day','Africa/Lagos · calendar-led work']].map(a=>`<div class="card"><span class="small">${a[1]}</span><div class="metric">${a[0]}</div><span class="small">${a[2]}</span></div>`).join('')}</div><div class="grid"><div class="card hero"><span class="pill">THE HAMZURY METHOD</span><h2>From a business need<br>to a verified result.</h2><p>Understand the situation. Agree the priorities. Route the work. Review the evidence. Close the loop.</p><button class="light" onclick="go('Workflow map')">Explore the operating model →</button></div><div class="card"><div class="eyebrow">Today’s focus</div><h2>Research into action.</h2><p>Thursday presentations turn new knowledge into practical implementation proposals.</p><button class="secondary" onclick="go('Calendar & reports')">Open the weekly rhythm →</button></div></div><div class="sectionhead"><h2>Your ventures</h2><span class="small">Independent execution · Holding oversight</span></div><div class="grid">${ventures.map((v,i)=>`<div class="card venture"><div class="mark" style="background:${v[3]}">${v[2]}</div><div><h3>${v[0]}</h3><p>${v[1]}</p><span class="tag">CEO → departments → units</span></div></div>`).join('')}</div>`;}
if(page==='Workflow map'){const flows=[['01','Awareness','Content, referrals, affiliates, partnerships and direct enquiries create a traceable lead.'],['02','Strategy','Short discovery → reviewed assessment → priorities and roadmap.'],['03','Structure','Select services → confirm scope and quote → accept terms → verify payment.'],['04','Systems','Collect purchased-service requirements → route work → assign owner and calendar.'],['05','Delivery','Execute checklist → submit evidence → quality review → client review and delivery.'],['06','Success','Confirm outcome → record feedback → financial review → recommend next useful step.']];html=intro('Operating model','A complete loop.','Every handoff has an owner, a standard and a return path.')+`<div class="flow">${flows.map(v=>`<div class="step"><b>${v[0]}</b><h3>${v[1]}</h3><p>${v[2]}</p></div>`).join('')}</div><div class="two"><div class="card"><h2>Authority & accountability</h2>${[['Holding management','Sets venture targets, standards, timetable and review requirements.'],['Venture CEO','Owns venture performance, staffing, departmental plans, approved spending and reports.'],['Department / unit lead','Breaks weekly targets into assignments; checks workload, evidence and quality.'],['Staff, intern or student','Accepts an appropriate assignment, follows the calendar, submits evidence and reports blockers.'],['Reviewer','Approves against acceptance criteria or returns specific corrections to the owner.']].map(x=>`<div class="row"><div><h3>${x[0]}</h3><p class="small">${x[1]}</p></div></div>`).join('')}</div><div class="card"><h2>Handoff contract</h2><ul><li>Source record and receiving venture</li><li>Named accountable owner and reviewer</li><li>Scope, deliverables and acceptance criteria</li><li>Verified payment status where applicable</li><li>Requirements and missing inputs</li><li>Deadline, time block and dependencies</li><li>Evidence, decision and next action</li></ul><div class="notice">Blocked work returns to the responsible owner with a reason and next review time. A submitted task is not automatically completed.</div><button onclick="go('Work & approvals')">Try assignment & review →</button></div></div>`;}
if(page==='Client journey')html=client();
if(page==='Work & approvals')html=intro('Execution workspace','Work that closes the loop.','Assign → execute → submit evidence → review → approve or return.',`<button onclick="newTask()">+ Create assignment</button>`)+`<div class="grid">${tasks.map((t,i)=>`<div class="card"><div class="row" style="padding-top:0"><span class="pill">${esc(t.venture)}</span><span class="small">${esc(t.due)}</span></div><h2>${esc(t.title)}</h2><p class="small">Owner: ${esc(t.owner)}</p><div class="notice"><b>Acceptance standard</b><br>${esc(t.standard)}</div><label>Status</label><select onchange="changeStatus(${i},this.value)">${['Ready','In progress','Blocked','Submitted','Under review','Changes requested','Approved'].map(s=>`<option ${s===t.status?'selected':''}>${s}</option>`).join('')}</select><label>Evidence / blocker / review feedback</label><textarea id="ev${i}" placeholder="Record the result, evidence reference or blocker">${esc(t.evidence)}</textarea><div class="tabs"><button onclick="saveEvidence(${i})">Save update</button><button onclick="submitTask(${i})">Submit for review</button></div></div>`).join('')}</div><div class="notice">Demonstration controls are available to explore the full loop. In production, only authorized assignees and reviewers receive the corresponding actions; all changes require an audit record.</div>`;
if(page==='Calendar & reports')html=calendar();
if(page==='Ventures & people')html=intro('Organization','Built around capability.','No fixed team size. Assign staff, interns and students according to readiness and supervision.')+`<div class="notice">Role preview: <b>${esc($('#role').value)}</b> · ${({'Holding management':'Review all ventures, approve standards and set monthly targets.','Venture CEO':'Manage the venture, delegate work and report results to Holding.','Team member':'See assigned work, calendar, standards, training and feedback.','Client':'See only their own roadmap, quote, requirements, updates and deliverables.'})[$('#role').value]}</div><div class="grid">${ventures.map(v=>`<div class="card"><div class="mark" style="background:${v[3]}">${v[2]}</div><h2>${v[0]}</h2><p>${v[1]}</p><details><summary>Departments & operating responsibilities</summary><ul><li>CEO: targets, team, finance, quality and Holding reports</li><li>Marketing & CRM: campaigns, leads, follow-up and conversion</li><li>Operations: requirements, production, review and delivery</li><li>Venture-specific units configured by the CEO</li><li>Supervise relevant Hub projects with named mentors</li></ul></details></div>`).join('')}</div><div class="two" style="margin-top:20px"><div class="card"><h2>Member activation</h2><p>Role and terms confirmed → workspace access → standards acknowledgement → practical system training → supervised first assignment → readiness review.</p><p class="small">Existing CEOs receive updated operating rules and assignments; no repeat venture orientation is required.</p></div><div class="card"><h2>Talent progression</h2><p>Hub training → supervised project → assessed capability → junior staff / paid project / suitable employment or own business route.</p><p class="small">Innovator→CEO requires three weeks of supervised junior staff; programme schedules remain separate from the Holding work calendar.</p></div></div>`;
if(page==='Products & growth')html=products();if(page==='Standards library')html=standards();$('#app').innerHTML=html;}
function client(){let labels=['Discovery','Assessment','Package','Quotation','Payment','Onboarding','Delivery'];let h=intro('Client experience','Your business. Your next step.','Explore the full journey with a sample client. No order or payment is created.')+`<div class="tabs">${labels.map((s,i)=>`<button class="${journey===i?'active':''}" onclick="journey=${i};render()">${i+1}. ${s}</button>`).join('')}</div><div class="progress">${labels.map((_,i)=>`<i class="${i<=journey?'on':''}"></i>`).join('')}</div>`;
if(journey===0)return h+`<div class="two"><div class="card"><div class="eyebrow">Awareness · short discovery</div><h2>Tell us what you want to build.</h2><form onsubmit="saveDiscovery(event)"><label>Business name</label><input name="name" value="${esc(discovery.name)}" placeholder="Your business name" required><label>Industry and main services</label><input name="industry" value="${esc(discovery.industry)}" placeholder="What do you sell, and to whom?" required><label>Current sales situation</label><select name="sales"><option>Occasional customers</option><option>Regular customers; want more</option><option>Enquiries but few sales</option><option>Not yet making sales</option></select><label>Your 1–3 year vision</label><textarea name="vision" placeholder="What should the business become?">${esc(discovery.vision)}</textarea><label>Existing assets beyond social media</label><input name="assets" value="${esc(discovery.assets)}" placeholder="Logo, portfolio, website, team, records…"><div class="notice">Already understood in this demonstration: operating business; wants more customers; unclear structure; social media presence; review priorities before budget.</div><button>Prepare preliminary roadmap →</button></form></div><div class="card"><h2>Only ask what matters now.</h2><p>Discovery identifies the business, customers, sales situation and vision. Detailed staff expertise and document uploads belong in onboarding when the purchased scope requires them.</p><p>No industry, legal need or missing capability is assumed from an incomplete answer.</p><div class="notice">Production requirement: conditional questions, secure saved responses and a team-reviewed assessment before sharing professional recommendations.</div></div></div>`;
if(journey===1)return h+`<div class="card"><span class="pill">Preliminary · requires team review</span><h1>${esc(discovery.name||'Your business')} roadmap</h1><p>${esc(discovery.industry||'Industry not supplied')} · ${esc(discovery.sales||'Sales situation to verify')}</p><div class="notice"><b>Vision:</b> ${esc(discovery.vision||'Not yet supplied. Confirm before final recommendations.')}<br><b>Known assets:</b> Social media${discovery.assets?', '+esc(discovery.assets):'; other assets to verify'}.</div><div class="grid">${card('1. Clarify the offer','Review services, ideal customers, positioning and pricing evidence. Deliver: agreed offer and prioritized action plan.')}${card('2. Improve conversion','Review social enquiries and follow-up. Deliver: sales scripts, pipeline stages and customer acquisition plan, if gaps are found.')}${card('3. Support delivery','Review work, costs and client updates. Deliver: an appropriate workflow and reporting setup where needed.')}</div><p>These are investigation priorities, not confirmed deficiencies. Registration, tax, branding and technology services are recommended only after checking relevance and what already exists.</p><button onclick="journey=2;render()">Explore your selectable package →</button></div>`;
if(journey===2)return h+`<div class="notice">Catalogue demonstration · Prices are not supplied. Request an approved quotation; no invented total is shown.</div><div class="grid">${catalog.map((c,i)=>`<div class="card"><span class="pill">${c[1]}</span><h2>${c[0]}</h2><p>${c[2]}</p><p class="small">Deliverables: ${c[3]}</p><details><summary>Scope, timing & requirements</summary><p>${c[4]}</p><p>Price and delivery estimate: to be confirmed following scope review. Third-party fees must be itemized separately.</p></details><div class="row"><span class="small">Quote required</span><button class="${selected.includes(i)?'secondary':''}" onclick="toggleService(${i})">${selected.includes(i)?'Remove':'Add to package +'}</button></div></div>`).join('')}</div><div class="card" style="margin-top:18px"><h3>${selected.length} service${selected.length===1?'':'s'} selected</h3><p>${selected.map(i=>catalog[i][0]).join(' · ')||'Choose only the priorities that suit your business.'}</p><button onclick="if(!selected.length){toast('Select at least one service');return}journey=3;render()">Review quotation request →</button></div>`;
if(journey===3)return h+`<div class="card"><span class="pill">Draft request · not a quotation</span><h2>Confirm the scope before committing.</h2>${selected.length?selected.map(i=>`<div class="row"><div><h3>${catalog[i][0]}</h3><span class="small">${catalog[i][3]}</span></div><span>Unpriced</span></div>`).join(''):'<p>No services selected. Return to Package to choose services.</p>'}<div class="notice">A formal quote must include approved item prices, third-party costs, delivery estimates, requirements, revision limits, payment schedule and acceptance terms. Total is unavailable until pricing is approved.</div><button onclick="toast('Sample quotation request recorded. Team review would follow in the live system.')">Request formal quotation</button></div>`;
if(journey===4)return h+`<div class="two"><div class="card"><span class="status">Awaiting approved quotation</span><h2>Payment verification gate</h2><p>Quote accepted → payment submitted → finance verifies the transaction → paid order activates.</p><div class="notice">A receipt upload or client confirmation does not mark an order paid. No payment is accepted in this demonstration.</div><button class="secondary" onclick="journey=5;render()">Preview post-payment onboarding →</button></div><div class="card"><h2>What activates work?</h2><ul><li>Accepted, approved scope and terms</li><li>Verified payment or authorized deposit terms</li><li>Service-specific requirements checked</li><li>Work order routed to the responsible venture</li></ul></div></div>`;
if(journey===5)return h+`<div class="card"><span class="pill">Post-payment preview only</span><h2>Requirements follow the purchased service.</h2><div class="grid">${card('bizdoc requirements','Applicable business and applicant details; authorized registration documents; requirements checked against the selected service.')}${card('medialy requirements','Existing logo, brand assets, audience, references, approved messaging and relevant account access through a secure process.')}${card('subt requirements','Team size, roles and expertise; current tools; process map; logo; integrations and supported configuration needs.')}</div><label>Try choosing a brand asset (filename preview only)</label><input type="file" onchange="toast(this.files.length?'Selected: '+this.files[0].name:'No file selected')"><div class="notice">Files are not uploaded or stored here. The live service must use controlled access, retention rules and secure storage. A team checks completeness before scheduling production.</div><button onclick="journey=6;render()">Preview work and delivery →</button></div>`;
return h+`<div class="two"><div class="card"><span class="pill">Sample project</span><h2>Clear ownership. Visible progress.</h2>${[['Requirements reviewed','Complete'],['Work assigned to venture','Complete'],['Production and internal QA','In progress'],['Client review','Upcoming'],['Final delivery and acceptance','Upcoming']].map(a=>`<div class="row"><h3>${a[0]}</h3><span class="small">${a[1]}</span></div>`).join('')}<p class="small">Next action: Operations lead submits evidence for internal review.</p></div><div class="card"><h2>Client communication standard</h2><p>Every update states what is completed, what is happening, what is needed, the next action and when the next update is due.</p><div class="notice">No client goes 48 hours without an update. Alert the owner, escalate overdue updates and record the communication.</div><button onclick="toast('Sample feedback request recorded')">Request a correction / give feedback</button><p class="small">Final deliverables and secure downloads appear only when released. No sample file is presented as completed work.</p></div></div>`;}
const catalog=[['Business clarity & roadmap','Holding','Understand the priorities before spending.','Discovery review, customer profile, offer review, staged roadmap.','Requires business model, sales context and intended outcomes.'],['Marketing & conversion system','medialy','Connect suitable enquiries to a consistent sales process.','Content direction, follow-up scripts and CRM pipeline design.','Requires current channels, audience, offer and enquiry examples.'],['Reusable business software','subt','Configure a proven solution for a specific business type.','Approved template, branding configuration, QA and user handover.','Standard configuration included only as specified. Add-ons are scoped; custom changes require technical approval.'],['Compliance & documentation','bizdoc','Address the requirements relevant to the selected business.','Service-specific processing and agreed documents.','Applicability, current regulatory requirements and third-party costs require verification.'],['Smart automation','iotics','Solve a practical hardware or connected-device problem.','Assessment, scoped installation or prototype, testing and handover.','Requires site assessment, equipment scope and technical feasibility review.'],['Training & talent development','hamzury hub','Build practical capability through supervised application.','Programme placement, learning plan, supervised projects and assessment.','Programme eligibility and timetable confirmed before enrolment.'],['Grants & partnerships','iwiin','Pursue opportunities suited to the organization.','Eligibility review, opportunity assessment and agreed application support.','Requires organization evidence and opportunity terms. Awards are not guaranteed.']];
function toggleService(i){selected=selected.includes(i)?selected.filter(x=>x!==i):[...selected,i];render()}function saveDiscovery(e){e.preventDefault();discovery=Object.fromEntries(new FormData(e.target));localStorage.setItem('hh-discovery',JSON.stringify(discovery));journey=1;render()}function newTask(){ $('#app').innerHTML=intro('New assignment','Define the result first.','A task needs a responsible person, a standard and a deadline.')+`<form class="card" onsubmit="createTask(event)"><label>Expected result</label><input name="title" required><label>Venture</label><select name="venture">${ventures.map(v=>`<option>${v[0]}</option>`).join('')}</select><label>Responsible person / role</label><input name="owner" required><label>Deadline</label><input name="due" type="datetime-local" required><label>Acceptance criteria</label><textarea name="standard" required></textarea><div class="tabs"><button>Create assignment</button><button type="button" onclick="render()">Cancel</button></div></form>`}function createTask(e){e.preventDefault();tasks.push({...Object.fromEntries(new FormData(e.target)),status:'Ready',evidence:''});persist();render();toast('Assignment created')}function saveEvidence(i){tasks[i].evidence=$('#ev'+i).value;persist();toast('Update saved')}function submitTask(i){if(!$('#ev'+i).value.trim()){toast('Add completion evidence before submitting');return}tasks[i].evidence=$('#ev'+i).value;tasks[i].status='Under review';persist();render();toast('Submitted for review')}function changeStatus(i,v){if((v==='Approved'||v==='Submitted'||v==='Under review')&&!tasks[i].evidence.trim()){toast('Save evidence before advancing this task');render();return}tasks[i].status=v;persist();render()}
const week={Monday:['Targets & weekly planning','08:00–08:30 · Individual priorities and checklist','08:00–09:00 · Target receipt window; reconcile the 08:00 overlap before calendar activation','11:00–12:00 · Plans submitted, reviewed and work distributed','Other blocks · Core revenue and client delivery work'],Tuesday:['Training that supports targets','08:00–08:30 · Individual priorities and checklist','Scheduled training · Systems, skills and practical application; exact time to confirm','Apply learning to active work and capture evidence'],Wednesday:['Research & knowledge development','08:00–08:30 · Individual priorities and checklist','11:00 · Five-minute solitude, then research meeting; confirm exact meeting duration','Investigate industry developments, useful tools and practical opportunities','Hub Arena follows its own Wednesday 11:00–14:00 programme; resolve shared-person conflicts'],Thursday:['Present, assess, implement','08:00–08:30 · Individual priorities and checklist','Five-minute presentations · New development and why it matters','Useful idea or tool · Value, cost and limitations','Implementation plan · Feasibility, owner, timing and opportunity','Unfinished valuable research may continue; longer discussion moves to Monday'],Friday:['Results, review & culture','08:00–08:30 · Individual priorities and checklist','Venture review · Verified revenue, delivery, pipeline and blockers','Submit weekly report and next-week recommendations','Staff engagement, games and office culture · Times to confirm']};
function calendar(){return intro('Time is an operating standard','A rhythm for real progress.','08:00–17:00 · Africa/Lagos · core work continues around scheduled routines.')+`<div class="tabs">${Object.keys(week).map(d=>`<button class="${d===day?'active':''}" onclick="day='${d}';render()">${d}</button>`).join('')}</div><div class="two"><div class="card"><div class="eyebrow">${day}</div><h2>${week[day][0]}</h2>${week[day].slice(1).map(s=>`<div class="row"><span>${s}</span></div>`).join('')}<div class="notice">Primary work follows the calendar. Urgent secondary work is triaged and rescheduled with the owner; it must not silently erase commitments. No invented meeting times have been added.</div></div><div class="card"><h2>Submit the operating record</h2><form onsubmit="event.preventDefault();localStorage.setItem('hh-report',JSON.stringify(Object.fromEntries(new FormData(this))));toast('Report saved in this browser')"><label>Record type</label><select name="type"><option>Daily checklist & closeout</option><option>Weekly target plan</option><option>Research & implementation proposal</option><option>Friday venture report</option><option>Meeting decisions</option></select><label>Target / expected result</label><input name="target" required><label>Results and evidence</label><textarea name="result" required></textarea><label>Blocker, next action, owner and deadline</label><textarea name="next" required></textarea><button>Submit record</button></form></div></div>`}
function products(){return intro('Demand → conversion → delivery','Grow through proven offers.','Every venture markets its own services, supported by Holding-wide standards.')+`<div class="grid">${catalog.map(c=>`<div class="card"><span class="pill">${c[1]}</span><h2>${c[0]}</h2><p>${c[2]}</p><details><summary>Product standard</summary><p>${c[3]}</p><p>${c[4]}</p><p>Publish only after scope, approved price, requirements, delivery estimate, owner and acceptance checklist are complete.</p></details></div>`).join('')}</div><div class="two" style="margin-top:20px"><div class="card"><h2>CRM & affiliate loop</h2><p>Capture source → qualify → discovery / direct service selection → quote → follow-up → verified payment → handoff → feedback → suitable next offer.</p><p class="small">Track lead ownership, consent, next contact date, referral attribution, conversion evidence and approved reward terms. Recover old clients through relevant, respectful follow-up.</p></div><div class="card"><h2>subt product modification rules</h2><ul><li>Standard configuration: approved branding and settings</li><li>Paid add-on: scoped supported extension</li><li>Custom development: technical review before promise or quotation</li><li>Reject changes that undermine security, reliability or the product purpose</li></ul></div></div>`}
function standards(){let data=[['ASS​​SS operating standard','Awareness: understand the situation. Strategy: agree priorities. Structure: clarify ownership and scope. Systems: execute repeatable workflows. Success: verify the result and next action.'],['Task & handoff SOP','Create the assignment with owner, reviewer, scope, acceptance criteria, dependencies and deadline. Confirm receipt. Execute. Record blockers early. Submit evidence. Review. Approve or return corrections. Record the outcome and notify the next owner.'],['Client communication SOP','Acknowledge the request, clarify only missing information, explain the next step and record ownership. No client goes 48 hours without an update. Include completed work, current work, client requirements and next update time. Escalate delayed or disputed work with context.'],['Payment & activation SOP','Client acceptance and a submitted receipt do not equal verified payment. Finance verifies payment against the accepted quote. Activate only the agreed funded scope. Collect service-specific onboarding requirements and validate completeness before production.'],['Quality & delivery SOP','Check each deliverable against scope and acceptance criteria. Record internal review, client feedback, revision decision and final approval. Release the correct versions to the authorized client. Archive the delivery record and request outcome feedback.'],['Research presentation template','1. New development: source, date, understanding and why it matters. 2. Idea or tool: problem solved, alternatives, costs and limitations. 3. Implementation: owner, steps, feasibility, deadline, success measure and opportunity. Five minutes; useful incomplete work can continue.'],['Daily and weekly reporting standard','Daily: planned work, completed results, evidence, blockers and next action. Weekly: target, verified revenue, spend, delivery, pipeline, learning, team issues and next-week commitments. Monthly: venture performance, finance review and target decisions.'],['Finance policy register','Latest stated operating model: 55% venture allocation and 45% Holding. This is a venture allocation, not automatically CEO personal pay. Define eligible costs, profit basis, taxes, reserves, allocation timing and approvals before automation. Earlier detailed allocation proposals require reconciliation. Internal venture tasks use the approved 50% internal rate only where applicable.'],['People, onboarding & Hub supervision','No fixed headcount. Define role, authority, supervisor, access and readiness. Existing CEOs receive updated system activation rather than repeated venture orientation. Ventures supervise specialist student projects; Hub retains programme administration and student support. New member training includes a supervised first task.'],['Access & information standard','Production roles must enforce data access on the server. Clients see their own records only. Venture teams see authorized work. Restrict identity documents and payment records, retain audit history and control delivery access. This experience uses browser-local sample records and must not receive sensitive client data.'],['Decisions still to confirm','Reconcile Monday 08:00–08:30 checklist with the 08:00–09:00 target window. Confirm training, presentation, Friday review and daily closeout times; Saturday applicability; meeting durations; final finance allocation rules; named reviewers, staff rosters, approved prices and current brand assets. No October launch date is reused as a future deadline.']];return intro('The shared standard','How Hamzury works.','The approved operating model, templates and decisions behind every screen.')+`<div class="two"><div class="card">${data.map(([t,p])=>`<details><summary>${t}</summary><p>${p}</p></details>`).join('')}</div><div><div class="card"><h2>The definition of done</h2><ul><li>The agreed result exists</li><li>Evidence is attached or referenced</li><li>The authorized reviewer approves</li><li>The receiving person is informed</li><li>The next action and record are updated</li></ul></div><div class="card" style="margin-top:20px"><h2>Experience vs live operations</h2><p>This site demonstrates workflows, forms, local task persistence and package selection. Live accounts, shared data, secure document storage, payment verification, reminders and external messaging require the production backend and integrations.</p><button class="secondary" onclick="if(confirm('Reset demonstration records in this browser?')){localStorage.removeItem('hh-tasks');localStorage.removeItem('hh-discovery');localStorage.removeItem('hh-report');location.reload()}">Reset demonstration</button></div></div></div>`}
